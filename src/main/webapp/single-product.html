<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="bookNameOnTittle">The Great Gatsby - Bookly</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'
    viewBox='0 0 16 16'><path fill='%230d6efd' d='M8.5 2.687c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 0 0 0 2.5v11a.5.5 0 0 0 .707.455c.882-.4 2.303-.881 3.68-1.02 1.409-.142 2.59.087 3.223.877a.5.5 0 0 0 .78 0c.633-.79 1.814-1.019 3.222-.877 1.378.139 2.8.62 3.681 1.02A.5.5 0 0 0 16 13.5v-11a.5.5 0 0 0-.293-.455c-.952-.433-2.48-.952-3.994-1.105C10.413.809 8.985.936 8 1.783'/></svg>">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <!-- Simple Notify -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simple-notify/dist/simple-notify.css"/>

</head>
<body>
<!-- Header Component -->
<header class="sticky-top bg-white shadow-sm">
    <header-content></header-content>
</header>

<!-- Search Modal -->
<div class="modal fade" id="searchModal" tabindex="-1" aria-labelledby="searchModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h5 class="modal-title" id="searchModalLabel">Search Books</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <input type="text" class="form-control" placeholder="Search for books, authors, genres...">
                    <button class="btn btn-primary" type="button">
                        <i class="bi bi-search"></i> Search
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Main Content -->
<main class="py-5">
    <div class="container">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                <li class="breadcrumb-item"><a href="shop.html">Shop</a></li>
                <li class="breadcrumb-item"><a id="category" href=""></a></li>
                <li class="breadcrumb-item active" aria-current="page" id="book-name"></li>
            </ol>
        </nav>

        <div class="row g-4">
            <!-- Product Image Column -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-3">
                        <!-- Main Book Cover -->
                        <div class="book-cover-container text-center mb-4">
                            <img id="image" src=""
                                 alt=""
                                 class="img-fluid book-cover-main">
                            <div class="mt-3">
                                <span class="badge bg-success">In Stock</span>
                                <span class="badge bg-warning text-dark ms-2">Bestseller</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Product Details Column -->
            <div class="col-lg-8">
                <div class="product-details">
                    <!-- Title and Author -->
                    <h1 class="h2 fw-bold mb-2" id="productTitle"></h1>
                    <p class="text-muted mb-3">by <a href="#" class="text-decoration-none link-disabled text-dark" id="author"></a></p>

                    <!-- Rating -->
                    <!--                    <div class="d-flex align-items-center mb-3">-->
                    <!--                        <div class="rating-stars">-->
                    <!--                            <i class="bi bi-star-fill text-warning"></i>-->
                    <!--                            <i class="bi bi-star-fill text-warning"></i>-->
                    <!--                            <i class="bi bi-star-fill text-warning"></i>-->
                    <!--                            <i class="bi bi-star-fill text-warning"></i>-->
                    <!--                            <i class="bi bi-star-half text-warning"></i>-->
                    <!--                        </div>-->
                    <!--&lt;!&ndash;                        <span class="ms-2">4.5 (1,234 reviews)</span>&ndash;&gt;-->
                    <!--                        &lt;!&ndash;                        <span class="ms-3">&ndash;&gt;-->
                    <!--                        &lt;!&ndash;                                <i class="bi bi-bookmark-check text-success"></i>&ndash;&gt;-->
                    <!--                        &lt;!&ndash;                                2,500+ copies sold&ndash;&gt;-->
                    <!--                        &lt;!&ndash;                            </span>&ndash;&gt;-->
                    <!--                    </div>-->

                    <!-- Price -->
                    <div class="price-section mb-4">
                        <h3 id="price" class="text-primary fw-bold"></h3>
                        <!--                        <p class="text-muted">-->
                        <!--                            <s>$19.99</s>-->
                        <!--                            <span class="badge bg-danger ms-2">Save 25%</span>-->
                        <!--                        </p>-->
                        <!--                        <small class="text-success">-->
                        <!--                            <i class="bi bi-truck"></i> Free shipping on orders over $25-->
                        <!--                        </small>-->
                    </div>

                    <!-- Book Details -->
                    <div class="book-meta mb-4">
                        <div class="row">
                            <div class="col-md-6">
                                <ul class="list-unstyled">
                                    <li class="mb-2">
                                        <strong>ISBN:</strong>
                                        <span id="isbn" class="text-muted"></span>
                                    </li>
                                    <li class="mb-2">
                                        <strong>Publisher:</strong>
                                        <span id="publisher" class="text-muted"></span>
                                    </li>
                                    <li class="mb-2">
                                        <strong>Publication Date:</strong>
                                        <span id="publishedDate" class="text-muted"></span>
                                    </li>
                                </ul>
                            </div>
                            <div class="col-md-6">
                                <ul class="list-unstyled">
                                    <li class="mb-2">
                                        <strong>Pages:</strong>
                                        <span id="pages" class="text-muted"></span>
                                    </li>
                                    <li class="mb-2">
                                        <strong>Genre:</strong>
                                        <span id="genre" class="text-muted"></span>
                                    </li>
                                    <li class="mb-2">
                                        <strong>Language:</strong>
                                        <span id="language" class="text-muted"></span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <!-- Quantity Selector -->
                    <div class="quantity-selector mb-4">
                        <label class="form-label fw-bold">Quantity:</label>
                        <div class="input-group" style="max-width: 150px;">
                            <button class="btn btn-outline-secondary" type="button" id="decrease-qty">
                                <i class="bi bi-dash"></i>
                            </button>
                            <input type="number" class="form-control text-center" value="1" min="1" max="10"
                                   id="quantity-input">
                            <button class="btn btn-outline-secondary" type="button" id="increase-qty">
                                <i class="bi bi-plus"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="action-buttons d-flex flex-wrap gap-3 mb-5">
                        <button class="btn btn-primary btn-lg flex-fill" id="add-to-cart">
                            <i class="bi bi-cart-plus me-2"></i> Add to Cart
                        </button>
                        <button class="btn btn-success btn-lg flex-fill" id="buy-now">
                            <i class="bi bi-lightning me-2"></i> Buy Now
                        </button>
                        <button class="btn btn-outline-primary btn-lg" id="add-to-wishlist">
                            <i class="bi bi-heart me-2"></i> Wishlist
                        </button>
                    </div>

                    <!-- Product Description -->
                    <div class="product-description mb-5">
                        <h4 class="mb-3">Description</h4>
                        <div class="description-content">
                            <p id="description"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Related Products Section -->
        <div class="related-products mt-5 pt-5 border-top">
            <h3 class="mb-4">You May Also Like</h3>
            <div class="row g-4" id="related-products-section">
                <!-- Related Product 1 -->
                <template id="related-product-template">
                    <div class="col-md-3 col-sm-6">
                        <a class="r-product-link text-decoration-none text-dark" href="">
                            <div class="card h-100 border-0 shadow-sm">
                                <img class="r-image card-img-top" src="" alt="product image">
                                <div class="card-body">
                                    <h6 class="card-title r-title"></h6>
                                    <p class="text-muted small r-author"></p>
                                    <div class="d-flex justify-content-between align-items-center">
                                        <span class="fw-bold text-primary r-price"></span>
                                        <span class="btn btn-sm btn-outline-primary">View</span>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </div>
                </template>
            </div>
        </div>
    </div>
</main>

<!-- Footer Component -->
<footer class="bg-dark text-white py-5 mt-5">
    <footer-content></footer-content>
</footer>

<!-- Buy Now Modal -->
<div class="modal fade" id="buyNowModal" tabindex="-1" aria-labelledby="buyNowModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold" id="buyNowModalLabel">
                    <i class="bi bi-lightning-fill me-2"></i>Buy Now – Quick Checkout
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">

                <!-- Order Summary -->
                <div class="card border-0 bg-light mb-4">
                    <div class="card-body">
                        <h6 class="fw-bold mb-3"><i class="bi bi-bag-check me-2 text-success"></i>Order Summary</h6>
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="text-muted" id="bn-item-name">–</span>
                            <span class="fw-semibold" id="bn-item-price">–</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="text-muted">Quantity</span>
                            <span class="fw-semibold" id="bn-qty">–</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="text-muted">Shipping</span>
                            <span class="fw-semibold" id="bn-shipping">–</span>
                        </div>
                        <hr class="my-2">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="fw-bold">Total</span>
                            <span class="fw-bold text-success fs-5" id="bn-total">–</span>
                        </div>
                    </div>
                </div>

                <!-- Use Saved Address toggle -->
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="bn-use-saved-address">
                    <label class="form-check-label fw-semibold" for="bn-use-saved-address">
                        Use my saved address
                    </label>
                </div>

                <!-- Address Form -->
                <div id="bn-address-form">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">First Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="bn-first-name" placeholder="John">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Last Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="bn-last-name" placeholder="Doe">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">District <span class="text-danger">*</span></label>
                            <select class="form-select" id="bn-district">
                                <option value="0">Select District</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">City <span class="text-danger">*</span></label>
                            <select class="form-select" id="bn-city">
                                <option value="0">Select City</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Address Line 1 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="bn-line1" placeholder="House/Apt No., Street">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Address Line 2</label>
                            <input type="text" class="form-control" id="bn-line2" placeholder="Optional">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Postal Code <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="bn-postal" placeholder="00100">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Mobile <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="bn-mobile" placeholder="0771234567">
                        </div>
                    </div>
                </div>

            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-success btn-lg px-5 fw-bold" id="bn-pay-btn" onclick="processBuyNow()">
                    <i class="bi bi-credit-card me-2"></i>Pay Now
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/simple-notify/dist/simple-notify.min.js"></script>
<!-- Bootstrap JS Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/notiflix-aio-3.2.8.min.js"></script>
<!-- PayHere JS SDK -->
<script type="text/javascript" src="https://www.payhere.lk/lib/payhere.js"></script>

<!-- Custom JS -->
<script src="assets/js/single-product.js"></script>
<script src="assets/js/payment/buyNow.js"></script>
<script src="assets/js/header.js" defer></script>
<script src="assets/js/footer.js" defer></script>
<script src="assets/js/common.js" defer></script>
</body>
</html>
